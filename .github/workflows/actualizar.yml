name: Actualizar datos y publicar

# Cálculo diario por lotes de las 9 provincias de Castilla y León y publicación en GitHub Pages.
# - Cada mañana (cron) y a mano (Run workflow): cálculo completo con AEMET + Open-Meteo.
# - En cada push a main: solo se republica la web reutilizando los datos ya publicados.
# Si el resultado sale degradado (proveedor caído, provincia con datos de días anteriores), se publica
# igualmente y el último job falla para que GitHub avise por correo.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC (07:17 en invierno, 08:17 en verano, hora peninsular)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITIO_PUBLICADO: https://luismvhv.github.io/hongos-pronostico/

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      degradado: ${{ steps.comprobar.outputs.degradado }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q
      - name: Preparar sitio estático
        run: |
          mkdir -p sitio
          cp static/index.html sitio/index.html
          cp -r static sitio/static
          touch sitio/.nojekyll
      - name: Calcular las 9 provincias
        id: lote
        continue-on-error: true
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          MODO: ${{ github.event_name == 'push' && '--reutilizar' || '' }}
        run: python -u scripts/actualizar.py --salida sitio --previo "$SITIO_PUBLICADO" $MODO
      - name: Comprobar estado
        id: comprobar
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("sitio/datos/estado.json")
          e = json.loads(p.read_text()) if p.exists() else {"degradado": True}
          print("degradado=" + ("true" if e.get("degradado", True) else "false"))
          PY
          test -f sitio/datos/estado.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: calcular
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4

  avisar:
    needs: [calcular, publicar]
    if: needs.calcular.outputs.degradado == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::La actualización salió degradada (proveedor caído o provincias con datos anteriores). Revisa datos/estado.json en el sitio."
          exit 1
